name: worker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-real-sandbox:
    runs-on: ubuntu-24.04
    env:
      REQUIRE_SANDBOX: "1"
      WERK_WORKER_BWRAP: /usr/bin/bwrap
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare real namespace backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-pip python3-apt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets -- --nocapture
      - run: python3 -m unittest discover -s scripts/tests
      - name: Install isolated Chromium runtime
        run: sh scripts/install-browser.sh --local-deps chromium
      - name: Test real browser control and observation
        env:
          REQUIRE_BROWSER: "1"
          WW_BROWSER_ENGINES: chromium
        run: |
          cargo test --locked --test browser_control --test browser_mode -- --test-threads=1
          runtime="$HOME/.local/share/werk-worker/tools/browser"
          multiarch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          PYTHONPATH="$runtime/python" \
          PLAYWRIGHT_BROWSERS_PATH="$runtime/browsers" \
          LD_LIBRARY_PATH="$runtime/deps/usr/lib/$multiarch:$runtime/deps/lib/$multiarch${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            /usr/bin/python3 scripts/tests/test_browser_observation.py
      - run: python3 scripts/tests/tui_smoke.py target/debug/ww
      - run: python3 scripts/tests/selection_tui_smoke.py target/debug/ww
      - run: python3 scripts/tests/permissions_tui_smoke.py target/debug/ww
      - run: python3 scripts/tests/subagents_tui_smoke.py target/debug/ww
      - run: python3 scripts/tests/delegation_tui_smoke.py target/debug/ww
      - run: python3 scripts/tests/sessions_tui_smoke.py target/debug/ww
      - run: python3 scripts/tests/setup_smoke.py target/debug/ww
      - run: python3 scripts/tests/effort_tui_smoke.py target/debug/ww
      - run: cargo run --locked --example eval
      - run: cargo run --locked --example coding
      - run: cargo run --locked --example automation
      - run: cargo package --locked --allow-dirty
      - name: Install from package in a fresh directory
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          mkdir -p /tmp/worker-package /tmp/worker-workspace
          tar -xzf target/package/werk-worker-$version.crate -C /tmp/worker-package
          cargo install --locked --path /tmp/worker-package/werk-worker-$version --root /tmp/worker-install
          cd /tmp/worker-workspace
          /tmp/worker-install/bin/werk-worker --store /tmp/worker-installed.sqlite run --demo "package smoke"
          /tmp/worker-install/bin/werk-worker profiles inspect coding-basic
          /tmp/worker-install/bin/werk-worker skills inspect ticket-drafting
          /tmp/worker-install/bin/ww --store /tmp/worker-short.sqlite run --demo "short command smoke"
