[package]
name = "werk-worker"
version = "0.2.0"
default-run = "werk-worker"
edition = "2024"
rust-version = "1.88"
description = "Local general-purpose agent engine with durable sessions and scoped tool execution"
license = "Elastic-2.0"
repository = "https://github.com/philipbodenbach/werkWorker"
include = ["src/**", "scripts/*.py", "scripts/*.sh", "scripts/*.ps1", "scripts/tests/*.py", ".cargo/config.toml", "CHANGELOG.md", "CONTRIBUTING.md", "skills/**", "profiles/**", "examples/**", "docs/**", "evals/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-segmentation"]

[lib]
name = "werk_worker"

[[bin]]
name = "werk-worker"
path = "src/main.rs"
required-features = ["tui"]

[[bin]]
name = "ww"
path = "src/bin/ww.rs"
required-features = ["tui"]

[dependencies]
async-trait = "0.1"
base64 = "0.22.1"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
async-stream = "0.3"
ratatui = { optional = true, version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
# The level-triggered reader keeps large unbracketed pastes flowing on Unix.
crossterm = { optional = true, version = "0.29", features = ["use-dev-tty", "osc52"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex = "1.13"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-segmentation = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
