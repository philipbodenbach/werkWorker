[package]
name = "werk-worker"
version = "0.1.0"
default-run = "werk-worker"
edition = "2024"
rust-version = "1.88"
description = "Local general-purpose agent engine with durable sessions and scoped tool execution"
license = "Elastic-2.0"
repository = "https://github.com/philipbodenbach/werkWorker"
include = ["src/**", "skills/**", "profiles/**", "examples/**", "docs/**", "evals/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "werk_worker"

[[bin]]
name = "werk-worker"
path = "src/main.rs"

[[bin]]
name = "ww"
path = "src/bin/ww.rs"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
