name: Release automation tests
on:
  pull_request:
    paths: ['.github/workflows/release*.yml', 'scripts/**', 'Cargo.toml', 'Cargo.lock', 'CHANGELOG.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests
