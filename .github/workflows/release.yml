# Adapted from werk1112 (Elastic-2.0); see NOTICE.
name: Release
run-name: Release (${{ inputs.bump }})${{ inputs.draft && ' — draft' || '' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (all choices resume an already prepared release)
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      draft:
        description: Keep release as a draft after all platform artifacts are uploaded
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: werk-worker-product-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    env:
      CARGO_TARGET_DIR: target/cli-reference-neutral
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Require the default branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow on the default branch: $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Check release branch policy
        run: |
          # Match werk1112: validation runs here; generated metadata skips PR CI.
          # Read the policy without changing any repository protection settings.
          required_checks=$(gh api "repos/$GH_REPO/branches/$DEFAULT_BRANCH" \
            --jq '[.protection.required_status_checks.contexts[]?, .protection.required_status_checks.checks[]?.context] | unique | join(", ")')
          if [[ -n "$required_checks" ]]; then
            echo "::error::Release requires the werk1112 branch policy. Remove required PR status checks from $DEFAULT_BRANCH while retaining its other protections; see docs/releases.md. Still required: $required_checks"
            exit 1
          fi

      # Use the current branch tip on retries, including an already pushed release commit.
      - name: Check out the default branch and all release tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test release preparation
        run: python -m unittest discover -s scripts/tests -p 'test*release*.py'

      - name: Install stable Rust for CLI reference generation
        run: rustup toolchain install stable --profile minimal

      - name: Prepare versions, README, documentation and release notes
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
        run: python scripts/prepare-release.py "$BUMP" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Build and refresh the CLI reference
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          # Build after the version bump so the reference carries the release version.
          cargo +stable build --locked --bin werk-worker
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            # Retrying an existing release must never rewrite its tagged documentation.
            python scripts/generate-cli-reference.py target/cli-reference-neutral/debug/werk-worker --check
          else
            python scripts/generate-cli-reference.py target/cli-reference-neutral/debug/werk-worker
            python scripts/generate-cli-reference.py target/cli-reference-neutral/debug/werk-worker --check
          fi

      - name: Create the release preparation PR
        id: release-pr
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          git add --update
          if ! git diff --cached --quiet; then
            base_sha=$(git rev-parse HEAD)
            branch="release/auto-$RELEASE_TAG-${base_sha:0:12}"
            remote_ref=$(git ls-remote --heads origin "refs/heads/$branch")
            if [[ -n "$remote_ref" ]]; then
              git fetch origin "refs/heads/$branch"
              if [[ "$(git write-tree)" != "$(git rev-parse 'FETCH_HEAD^{tree}')" ]]; then
                echo "::error::Existing release branch differs from this preparation: $branch"
                exit 1
              fi
              release_sha=$(git rev-parse FETCH_HEAD)
              git reset --hard "$release_sha"
            else
              # Only generated release metadata skips duplicate PR CI. The
              # release tests, CLI reference build and validation still run.
              git commit -m "release(): $RELEASE_TAG [skip ci]"
              release_sha=$(git rev-parse HEAD)
              git push origin "HEAD:refs/heads/$branch"
            fi
            pr=$(gh pr list --head "$branch" --base "$DEFAULT_BRANCH" --state open \
              --json number --jq '.[0].number // empty')
            if [[ -z "$pr" ]]; then
              cat > "$RUNNER_TEMP/release-pr.md" <<'BODY'
          Automatically synchronize product versions, changelog, README and current
          documentation for this release, including the generated CLI reference
          from a fresh build. Three native platform jobs build and test the tagged
          source before uploading release assets. Release preparation tests passed.
          This generated metadata commit skips duplicate PR CI; product changes
          must pass their normal CI before starting Release.
          BODY
              pr=$(gh pr create --head "$branch" --base "$DEFAULT_BRANCH" \
                --title "release(): $RELEASE_TAG" --body-file "$RUNNER_TEMP/release-pr.md")
            fi
            pr=$(gh pr view "$pr" --json number --jq '.number')
            {
              echo "number=$pr"
              echo "head=$release_sha"
              echo "base=$base_sha"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the release preparation PR
        if: steps.release-pr.outputs.number != ''
        env:
          RELEASE_PR: ${{ steps.release-pr.outputs.number }}
          RELEASE_SHA: ${{ steps.release-pr.outputs.head }}
          BASE_SHA: ${{ steps.release-pr.outputs.base }}
        run: |
          # Honor branch protection and reject a changed base; never use --admin.
          remote_head=$(git ls-remote --heads origin "refs/heads/$DEFAULT_BRANCH")
          if [[ "${remote_head%%[[:space:]]*}" != "$BASE_SHA" ]]; then
            echo "::error::Default branch advanced during preparation. Restart Release from the latest branch."
            exit 1
          fi
          gh pr merge "$RELEASE_PR" --merge --match-head-commit "$RELEASE_SHA"
          merged_sha=$(gh pr view "$RELEASE_PR" --json mergeCommit --jq '.mergeCommit.oid')
          test -n "$merged_sha" && test "$merged_sha" != null
          git fetch origin "$DEFAULT_BRANCH"
          git checkout --detach "$merged_sha"
          # Catch a base update racing the merge request before tagging anything.
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$RELEASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$RELEASE_SHA^{tree}")"

      - name: Validate a previously prepared release on retry
        if: steps.release-pr.outputs.number == ''
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          # Reusing an existing tag does not create or modify a release commit.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            exit 0
          fi
          prepared_sha=$(git rev-parse HEAD)
          pr=$(gh api "repos/$GH_REPO/commits/$prepared_sha/pulls" --paginate \
            --jq '.[] | select(.merged_at != null) | @json' \
            | jq -rs --arg sha "$prepared_sha" --arg base "$DEFAULT_BRANCH" \
              '[.[] | select(.merge_commit_sha == $sha and .base.ref == $base)][0]')
          if [[ "$pr" == null ]]; then
            echo "::error::Untagged prepared version has no merged preparation PR. Prepare it through a PR first."
            exit 1
          fi

      - name: Validate and tag the merged release
        id: tag
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          python scripts/generate-cli-reference.py target/cli-reference-neutral/debug/werk-worker --check
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            python scripts/prepare-release.py check --notes-file "$RUNNER_TEMP/release-notes.md"
            git tag -a "$RELEASE_TAG" -m "werkWorker $RELEASE_TAG"
          fi
          git push origin "refs/tags/$RELEASE_TAG"
          release_sha=$(git rev-parse HEAD)
          echo "commit=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          # A new release stays a draft until every native package is validated.
          args=(--verify-tag --title "werkWorker $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft)
          if gh release view "$RELEASE_TAG" --json url --jq .url; then
            echo "Release already exists; keeping its assets, notes and publication state."
          else
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          {
            echo "### werkWorker $RELEASE_TAG"
            echo
            gh release view "$RELEASE_TAG" --json url,isDraft \
              --jq '"Release: " + .url + " (draft: " + (.isDraft | tostring) + ")"'
            echo "Build from tag \`$RELEASE_TAG\`."
            echo "Linux, macOS and Windows packages are built next, then uploaded together."
            echo "See docs/releases.md for the release checklist."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Package (${{ matrix.platform }})
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the Linux release compatible with Ubuntu 22.04's glibc.
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64.tar.gz
          - os: macos-15
            platform: macos
            target: aarch64-apple-darwin
            suffix: macos-aarch64.tar.gz
          - os: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Keep the native shell (PowerShell on Windows), like ci.yml. Git Bash
    # prepends its own link.exe ahead of MSVC when Cargo runs build scripts.
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_SHA: ${{ needs.release.outputs.commit }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify the tagged build source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          python -c 'import os, tomllib; version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Tag and package version differ"'
      - name: Install native Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: MSVC x64 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-msvc.ps1
      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          # Share compatible native caches with CI, never across runner versions.
          shared-key: native-${{ matrix.os }}-${{ matrix.target }}
      - name: Test release tooling and installers
        run: python -m unittest discover -s scripts/tests
      - name: Test native platform integration
        run: cargo test --locked --test platform
      - name: Build Unix release archive
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./scripts/package-release.sh "$PLATFORM"
      - name: Build Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Install and smoke the release archive
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          python scripts/smoke-install.py "releases/werkWorker-$RELEASE_TAG-$SUFFIX"
      - name: Retain the tested platform archive and checksum
        uses: actions/upload-artifact@v7
        with:
          name: werkWorker-release-${{ matrix.platform }}
          path: |
            releases/werkWorker-${{ needs.release.outputs.tag }}-${{ matrix.suffix }}
            releases/werkWorker-${{ needs.release.outputs.tag }}-${{ matrix.suffix }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          # Replacing an intermediate artifact on retry never replaces release assets.
          overwrite: true

  upload:
    name: Upload release assets
    needs: [release, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_SHA: ${{ needs.release.outputs.commit }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - name: Check out the release upload tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download the three packages from this release run
        uses: actions/download-artifact@v7
        with:
          pattern: werkWorker-release-*
          path: release-assets
          merge-multiple: true
      - name: Validate and upload all release assets
        run: |
          python scripts/upload-release-assets.py \
            --repo "$GH_REPO" --tag "$RELEASE_TAG" --commit "$RELEASE_SHA" \
            --directory release-assets --draft "$DRAFT"
          {
            echo "### werkWorker $RELEASE_TAG: all three platforms are available"
            echo
            gh release view "$RELEASE_TAG" --json url,isDraft \
              --jq '"Release: " + .url + " (draft: " + (.isDraft | tostring) + ")"'
            echo "Linux x86_64, macOS ARM64 and Windows x86_64 archives and SHA256 files verified."
          } >> "$GITHUB_STEP_SUMMARY"
