name: worker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # Keep the existing check names for the three native platforms.
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            check_name: linux-real-sandbox
          - os: macos-15
            target: aarch64-apple-darwin
            check_name: native (macos-14, macos, aarch64-apple-darwin, macos-aarch64.tar.gz)
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            check_name: native (windows-2022, windows, x86_64-pc-windows-msvc, windows-x86_64.zip)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Keep file/line backtraces while avoiding full type/variable debug data.
      # CI only: local development and Release keep their normal profiles.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: MSVC x64 environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          # Separate runner versions: Linux release builds use an older glibc.
          shared-key: native-${{ matrix.os }}-${{ matrix.target }}
      - name: Install the Linux test runner
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: nextest@0.9.124
          fallback: none
      - name: Test release tooling and installers
        run: python -m unittest discover -s scripts/tests
      - name: Test native platform integration
        if: runner.os != 'Linux'
        env:
          REQUIRE_SANDBOX: "1"
        run: |
          cargo test --locked --lib parallel::tests
          cargo test --locked --test platform --test native_workspace --test sandbox_contract --test native_coding --test native_lifecycle --test native_policy --test contracts --test macos_process --test windows_sandbox
      - name: Check native SDK and lint
        if: runner.os != 'Linux'
        run: |
          cargo test --locked --bin ww cli_config::tests
          cargo check --locked --no-default-features --lib
          cargo clippy --locked --all-targets -- -D warnings
          cargo check --locked --manifest-path examples/sdk-consumer/Cargo.toml
      - name: Prepare real namespace backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-pip python3-apt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
          echo "WERK_WORKER_BWRAP=/usr/bin/bwrap" >> "$GITHUB_ENV"
      - name: Lint and test with real Linux sandbox
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # Bound test processes within this job; keep every target and collect
          # all failures. --nocapture would disable nextest's parallel execution.
          cargo nextest run --locked --all-targets --no-fail-fast --test-threads=4 --success-output immediate
      - name: Install isolated Chromium runtime
        if: runner.os == 'Linux'
        run: sh scripts/install-browser.sh --local-deps chromium
      - name: Test real browser control and observation
        if: runner.os == 'Linux'
        env:
          REQUIRE_BROWSER: "1"
          WW_BROWSER_ENGINES: chromium
        run: |
          cargo test --locked --test browser_control --test browser_mode -- --test-threads=2
          runtime="$HOME/.local/share/werk-worker/tools/browser"
          multiarch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          PYTHONPATH="$runtime/python" \
          PLAYWRIGHT_BROWSERS_PATH="$runtime/browsers" \
          LD_LIBRARY_PATH="$runtime/deps/usr/lib/$multiarch:$runtime/deps/lib/$multiarch${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            /usr/bin/python3 scripts/tests/test_browser_observation.py
      - name: Test terminal workflows and SDK examples
        if: runner.os == 'Linux'
        run: |
          python3 scripts/tests/run_tui_smokes.py target/debug/ww
          cargo run --locked --example eval
          cargo run --locked --example coding
          cargo run --locked --example automation
      - name: Install from package in a fresh directory
        if: runner.os == 'Linux'
        run: |
          cargo package --locked --allow-dirty
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          mkdir -p /tmp/worker-package /tmp/worker-workspace
          tar -xzf target/package/werk-worker-$version.crate -C /tmp/worker-package
          # Verify source installation with existing debug dependencies.
          # Optimized archives and their installer smoke tests run in Release.
          cargo install --locked --debug --target-dir "$GITHUB_WORKSPACE/target" \
            --path /tmp/worker-package/werk-worker-$version --root /tmp/worker-install
          cd /tmp/worker-workspace
          /tmp/worker-install/bin/werk-worker --store /tmp/worker-installed.sqlite run --demo "package smoke"
          /tmp/worker-install/bin/werk-worker profiles inspect coding-basic
          /tmp/worker-install/bin/werk-worker skills inspect ticket-drafting
          /tmp/worker-install/bin/ww --store /tmp/worker-short.sqlite run --demo "short command smoke"
